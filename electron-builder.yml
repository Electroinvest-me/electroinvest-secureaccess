appId: me.electroinvest.secureaccess
productName: Electroinvest SecureAccess
copyright: Copyright © Electroinvest (GPL-3.0-or-later)

directories:
  output: dist
  buildResources: build

files:
  - "src/**/*"
  - "package.json"
  - "!**/*.map"

# The per-platform VPN engine + drivers are produced by scripts/ before packaging
# and shipped as extraResources. Each CI runner only populates its own platform's
# engines/<platform>-<arch> subdir, so bundling the whole engines/ dir is safe and
# avoids per-target path macros. src/core/platform.js resolves the right subdir.
extraResources:
  - from: engines
    to: engines
    filter: ["**/*"]
  - from: drivers
    to: drivers
    filter: ["**/*"]

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  icon: build/icon.png

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

appId: me.electroinvest.secureaccess
productName: Electroinvest SecureAccess
copyright: Copyright © Electroinvest (GPL-3.0-or-later)

directories:
  output: dist
  buildResources: build

# Only app code is packed; the per-platform VPN engine + drivers are shipped as
# extraResources (populated by scripts/ in CI before packaging).
files:
  - "src/**/*"
  - "package.json"
  - "!**/*.map"

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  icon: build/icon.png
  extraResources:
    - from: engines/darwin-${arch}
      to: engines/darwin-${arch}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  extraResources:
    - from: engines/win32-${arch}
      to: engines/win32-${arch}
    - from: drivers
      to: drivers

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  # runs the bundled driver setup (Wintun / TAP-Windows6) after install
  include: build/installer.nsh

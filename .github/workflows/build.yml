name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon (arm64) — Intel Macs are deprecated, not supported
            engine: bash scripts/fetch-engine-macos.sh arm64
            pack: npx electron-builder --mac --arm64 --publish never
          - os: windows-latest      # Windows x64
            engine: powershell -ExecutionPolicy Bypass -File scripts/fetch-engine-win-x64.ps1; powershell -ExecutionPolicy Bypass -File scripts/fetch-drivers.ps1
            pack: npx electron-builder --win --x64 --publish never
          - os: windows-11-arm      # Windows ARM64 (GitHub ARM64 runner)
            engine: powershell -ExecutionPolicy Bypass -File scripts/fetch-engine-win-arm64.ps1; powershell -ExecutionPolicy Bypass -File scripts/fetch-drivers.ps1
            pack: npx electron-builder --win --arm64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - name: Build/fetch engine (+drivers)
        shell: bash
        run: ${{ matrix.engine }}
      - name: Package (unsigned)
        shell: bash
        run: ${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        with:
          name: secureaccess-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore
